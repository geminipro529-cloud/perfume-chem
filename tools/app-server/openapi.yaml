openapi: 3.1.0
info:
  title: Perfume Chem Repo API
  description: >-
    Authenticated read/write API for the perfume-chem repository at
    D:\chatbots\perfume-chem. Workspace-relative paths only; .git, .env,
    .codex, .ssh, keys and secrets are fenced. Writes are exact-byte with
    SHA-256 verification and git apply --check before touching the tree.
  version: 1.0.0
servers:
  - url: https://add-yorkshire-pressing-operates.trycloudflare.com
    description: Public HTTPS URL from cloudflared quick tunnel
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "app_<token>"
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        workspace:
          type: string
        readonly:
          type: boolean
        head:
          type: string
    ReadResponse:
      type: object
      required:
        - path
        - bytes
        - sha256
        - content
      properties:
        path:
          type: string
        bytes:
          type: integer
        sha256:
          type: string
        content:
          type: string
    StatusResponse:
      type: object
      properties:
        ok:
          type: boolean
        status:
          type: string
        head:
          type: string
    ApplyResponse:
      type: object
      properties:
        applied:
          type: boolean
        patchFile:
          type: string
        status:
          type: string
        dry_run:
          type: boolean
        ok:
          type: boolean
        error:
          type: string
          nullable: true
    CommitResponse:
      type: object
      properties:
        ok:
          type: boolean
        head:
          type: string
        error:
          type: string
          nullable: true
    ApplyRequest:
      type: object
      required:
        - patch
      properties:
        patch:
          type: string
          description: Unified diff text with a/ b/ prefixes
        dry_run:
          type: boolean
          default: false
    CommitRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          maxLength: 500
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Health probe
      description: Returns ok and the readonly flag without authentication; workspace and current git HEAD only with a valid bearer token.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/read:
    get:
      operationId: readFile
      summary: Read a workspace-relative file
      description: >-
        Returns content, byte length and SHA-256 for a file inside the
        workspace. Absolute paths, .. escapes, and fenced paths are rejected.
      parameters:
        - name: path
          in: query
          required: true
          description: Workspace-relative file path (e.g. formulas/iris.md)
          schema:
            type: string
      responses:
        "200":
          description: File content with hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadResponse"
        "400":
          description: Escaped, absolute, fenced, or missing path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/status:
    get:
      operationId: gitStatus
      summary: Git working-tree status
      description: Returns git status --short plus current HEAD.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/apply:
    post:
      operationId: applyPatch
      summary: Verify and apply a unified diff
      description: >-
        Runs git apply --check --whitespace=error-all, then git apply. Use
        dry_run=true to check only. The patch must be a unified diff with
        a/ b/ prefixes; shell-style patches are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyRequest"
      responses:
        "200":
          description: Applied (or dry-run result)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyResponse"
        "400":
          description: Fenced path or invalid patch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Patch failed the git apply --check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/commit:
    post:
      operationId: commitChanges
      summary: Commit the changes applied through this server
      description: Stages and commits only the paths touched by patches applied through /api/apply since the last commit, marked with an App-Server-Commit trailer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitRequest"
      responses:
        "200":
          description: Committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitResponse"
        "400":
          description: Empty message or commit failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/revert:
    post:
      operationId: revertLastCommit
      summary: Soft-reset the last commit (bounded rescue)
      description: git reset --soft HEAD~1, refused unless HEAD is a commit this server made. Use only to undo a mistaken commit.
      responses:
        "200":
          description: Reverted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitResponse"
        "400":
          description: Nothing to revert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
