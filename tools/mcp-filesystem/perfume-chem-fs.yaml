config_version: 1
control_plane:
  base_url: https://api.openai.com
  tunnel_id: tunnel_6a76371038e0819187fd46fb04b45977
  api_key: env:CONTROL_PLANE_API_KEY
health:
  listen_addr: 127.0.0.1:8080
admin_ui:
  open_browser: false
mcp:
  # start_tunnel.ps1 starts server.mjs on this loopback URL and sets FS_MCP_AUTH_HEADER
  # ("Bearer <per-launch token>") in the environment; the token never goes in this file.
  server_urls:
    - channel: main
      url: http://127.0.0.1:8765/mcp
  extra_headers:
    Authorization: env:FS_MCP_AUTH_HEADER
