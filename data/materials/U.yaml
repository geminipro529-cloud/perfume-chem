    character: 'Ultralia | PerfumersWorld, https://www.perfumersworld.com/view.php?pro_id=6II13551: Luxury Methyl Ionone base with natural flowery Iris nuances. ... Flowery, Orris, Violet powdery woody, very typical of the Iris family with a strong Orris root character. The most floral and rich of all qualities of methyl ionone with a strong orris, violet character and only a slight fruity nuance. (grade A_producer; ). Second reader: CAS No. 1335-46-2 on page. Loaded 2026-10-25 (literature fill; source re-opened by a second reader).'
