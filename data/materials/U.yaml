    stevens_n: engine.odor_thresholds
    hedonic_valence: engine.hedonic_model
    user_in_inventory: inventory.txt
    supplier.perfumersworld: knowledge/perfumersworld_stock.md
    cas: 'PerfumersWorld product page https://www.perfumersworld.com/view.php?pro_id=6II13551 (Kenny''s supplier): "CAS 1335-46-2", "1-(2,6,6- trimethyl-1-cyclohex-2-enyl)pent-1-en-3-one" (methyl ionone, mixture of isomers) (via material-data-firecrawl/followup-20261008/F1_densities_identity.md)'
    density_25c_g_ml: 'TGSC https://thegoodscentscompany.com/data/rw1006171.html (CAS 1335-46-2): "0.92400 to 0.93200 @ 25.00 C."; midpoint 0.928 x 0.99705 g/mL (water at 25 C) = 0.9253; PerfumersWorld lists SG 0.9240 (no temperature)'
