    vp_25c_pa: 'ESTIMATE, not measured: RIFM safety assessment, Api et al., Food Chem Toxicol 134 (2019) 110716, https://fragrancematerialsafetyresource.elsevier.com/sites/default/files/1335-46-2.pdf: "0.00613 mm Hg @ 25 °C (EPI Suite)" = 0.817 Pa; same line gives 0.005 mm Hg at 20 °C (FMA Database); replaces an unsourced 0.002 Pa (via material-data-firecrawl/followup-20261008/F5_vp_irotyl_vetival_ultralia.md)'
    kaw_eff: engine.diffusion_model
    odt_air_ppb: 'ESTIMATE (Givaudan PROC/headspace route): Givaudan PROC estimate for Isoraldeine 70, a methyl ionone grade with the same CAS (1335-46-2); isomer ratios may differ. 0.143-0.212 ppb, geometric midpoint 0.174. Replaces 0.3, which had no source. Air detection threshold, ppb v/v at 25 C; full sources in engine/odor_thresholds.py _LITERATURE_ODT_2026_10_25. Loaded 2026-10-25 (literature fill; source re-opened by a second reader).'
