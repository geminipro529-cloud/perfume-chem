    vp_25c_pa: 'RIFM fragrance ingredient safety assessment, beta-caryophyllene, CAS Registry Number 87-44-5 (Api et al., Food Chem Toxicol 159 (2022) 112707) (https://fragrancematerialsafetyresource.elsevier.com/sites/default/files/87-44-5.pdf): ''Vapor Pressure: 0.02 mm Hg at 20 C (EPI Suite v4.0), 0.007 mm Hg at 20 C (FMA), 0.0312 mm Hg at 25 C (EPI Suite)''; printed 0.007 mm Hg at 20 C (FMA); FMA value quoted by RIFM; grade A_producer. Converted from 0.9333 Pa at 20 C to 25 C by Clausius-Clapeyron to 25 C with dHvap = 70.0 - 3.82 ln(VP/Pa) kJ/mol from the engine''s correlation (doi:10.1021/es980812j) = 1.513 Pa. CONFLICT RECORDED, NOT USED: producer safety data sheets for technical natural grades print 0.06 hPa at 20 C and 0.45 hPa at 50 C (BASF Isobionics Natural beta-Caryophyllene 80 SDS rev. 27.04.2026, ''measured''; Axxence natural beta-caryophyllene 225210 SDS rev. 03.09.2026), and RIFM''s structure card in the O-acetyleugenol assessment (8000-34-8) prints 0.06, 0.09 and 0.45 hPa at 20, 25 and 50 C (0.09 hPa = 9 Pa at 25 C). That is 6x the FMA figure. Reasoning, not a source: the engine models this molecule alone, and a total pressure measured on an 80-89 % natural grade includes its volatile impurities (1 mol % alpha-pinene at roughly 600 Pa would add about 6 Pa by itself), so the lower FMA figure is kept; the natural profiles that hold a caryophyllene row already use 1.0-1.5 Pa. Reopen if a measured value on the pure compound is found. Loaded 2026-10-27 (incoming-bottle data from the pink pepper thread; source re-opened by a second reader).'
