  character:
  notes:
  provenance:
    logp: 'ECHA registration dossier, Farnesol (EC 225-004-1), Partition coefficient (https://echa.europa.eu/information-on-chemicals/registered-substances/-/disreg/substance/external/100.022.731/4/8): ''The log Pow range from 4.60 to 4.78 (weighted average 4.72) at 22.3 C, as determined by HPLC. Key value for chemical safety assessment Log Kow (Log Pow): 4.72 at the temperature of: 22.3 C''; printed log Pow 4.60-4.78 (weighted average 4.72) at 22.3 C; OECD 117 / EU A.8 HPLC, GLP; three isomer peaks 4.60, 4.67, 4.78, area-weighted mean; grade A_measured. Second reader: Area-weighted mean rechecked: 0.292*4.60 + 0.105*4.67 + 0.604*4.78 = 4.72. OECD 117 HPLC is on the page; the GLP status was not in the text I saw. Loaded 2026-10-25 (literature fill; source re-opened by a second reader).'
    mw_g_mol: engine.diffusion_model
    vp_25c_pa: 'ESTIMATE (EPI Suite v4.11): RIFM fragrance ingredient safety assessment, farnesol, CAS Registry Number 4602-84-0, Food Chem Toxicol 182 (2023) 114229 (https://fragrancematerialsafetyresource.elsevier.com/sites/default/files/4602-84-0.pdf): ''Vapor Pressure: 0.000021 mm Hg at 20 °C (EPI Suite v4.0), 3.94e-005 mm Hg at 25 °C (EPI Suite v4.11)''; the read-across table gives ''Vapor Pressure (Pa @ 25 °C, EPI Suite)'' 0.00525 for farnesol. 3.94e-5 mm Hg x 133.322 = 0.005253 Pa; grade EST, no measured value printed. Replaces the unsourced 0.08 Pa from engine.diffusion_model (15x higher). Loaded 2026-10-27 (MySkinRecipes orders 2200410/2200413; source re-opened).'
    kaw_eff: engine.diffusion_model
    odt_air_ppb: engine.odor_thresholds
    odt_eth_ppm: engine.odor_thresholds
    stevens_n: engine.odor_thresholds
    user_in_inventory: inventory.txt
    supplier.perfumersworld: knowledge/perfumersworld_stock.md
    cas: 'TGSC: CAS Number: 4602-84-0 (https://www.thegoodscentscompany.com/data/rw1005092.html)'
    density_25c_g_ml: 'PubChem CID 445070 Farnesol, Experimental Properties: Density (https://pubchem.ncbi.nlm.nih.gov/rest/pug_view/data/compound/445070/JSON?heading=Experimental+Properties): ''0.8871 at 20 C/4 C (O''Neil, Merck Index, 13th ed.); 0.8846 at 68 F (NTP, 1992); Sp gr: 0.884-0.891 (FCC 5th ed.)''; printed 0.8871 at 20 C/4 C; handbook (Merck Index 13th ed.) via PubChem; grade A_measured. Measured at 20 C (about 0.004 g/mL above the 25 C value). Second reader: PubChem CID 445070, RecordTitle Farnesol. 20 C/4 C relative density equals g/mL at 20 C. CID 445070 is the (2E,6E) isomer record while the stock CAS is 4602-84-0 (farnesol, isomer mix); density hardly differs... Loaded 2026-10-25 (literature fill; source re-opened by a second reader).'
