    vp_25c_pa: 'RIFM fragrance ingredient safety assessment, Isolongifolene ketone, CAS registry number 23787-90-8, Food Chem Toxicol 2017 (https://www.sciencedirect.com/science/article/pii/S0278691517300807), Physical data: ''Vapor Pressure : 0.00143 mm Hg @ 20 C [EPI Suite 4.0], 0.001 mm Hg 20 C [FMA], 0.00259 mm Hg @ 25 C [EPI Suite]''; printed 0.001 mm Hg at 20 C (FMA); FMA value quoted by RIFM; grade A_producer. Converted from 0.1333 Pa at 20 C to 25 C by Clausius-Clapeyron with dHvap = 70.0 - 3.82 ln(VP/Pa) kJ/mol from the engine''s correlation (doi:10.1021/es980812j) = 0.2275 Pa. Givaudan Isolongifolanone 5850143 (https://www.givaudan.com/fragrance-beauty/fragrance-ingredients-business/fragrance-molecules/isolongifolanone) prints ''Vapour pressure 0.0013 hPa'' (0.13 Pa, temperature not stated), which agrees with the FMA figure. Loaded 2026-10-28 (PerfumersWorld orders of 25 Oct 2026; source re-opened).'
