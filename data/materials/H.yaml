    cas: 'PerfumersWorld 3XD17215 supplier SDS and RIFM assessment Food Chem. Toxicol. 182 (2023) 114253, doi:10.1016/j.fct.2023.114253: CAS 141773-73-1, as quoted in /mnt/project-files/material-data-firecrawl/BATCH1_FEMME_20261008.md (Helvetolide section, read 2026-10-08)'
    mw_g_mol: 'PerfumersWorld 3XD17215 supplier SDS: "MW 284.43, C17H32O3", as quoted in /mnt/project-files/material-data-firecrawl/BATCH1_FEMME_20261008.md (Helvetolide section, read 2026-10-08)'
    odt_air_ppb: 'Armanino, Charpentier, Flachsmann, Goeke, Liniger, Kraft, Angew. Chem. Int. Ed. 2020, doi:10.1002/anie.202005719: figure label "Helvetolide ... th 1.7 ng/L air" (read from a search excerpt; full page not readable), as quoted in /mnt/project-files/material-data-firecrawl/BATCH1_FEMME_20261008.md (Helvetolide section, read 2026-10-08); 1.7 ng/L x 24.465 / 284.43 = 0.146 ppb at 25 C'
    vp_note: 'Firmenich marketing sheet, https://www.firmenich.com/sites/default/files/uploads/files/ingredients/marketing-sheet/perfumery/HELVETOLIDE_947650.pdf: "0.02 Pa @20 C"; 20 C value, so recorded in notes and not in vp_25c_pa'
