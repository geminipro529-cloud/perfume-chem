  character:
  notes: 'Same molecule as Exaltolide (pentadecanolide, CAS 106-02-5), kept as a separate trade-name entry; physics copied from the Exaltolide entry. Previous MW 254.41 was a C16 lactone weight. Not in stock: inventory.txt marks Macrolide (10%) DEPLETED 2026-07-19. VP: the Vuilleumier 1995 figure (0.0002 torr = 0.027 Pa) has no temperature stated in the source dossier. ChemicalBook gives 0.085 Pa at 25 C, about 3x higher; the two sources disagree and the lower RIFM-cited value is used. Previous gate value 0.0001 Pa had no cited source.'
  provenance:
    cas: 'PerfumersWorld SKU 2XX14556 (CAS 106-02-5, MW 240.39) and The Good Scents Company (lists "Macrolide Supra" as a synonym of omega-pentadecalactone, CAS 106-02-5), as quoted in the inventory musk research dossier (allgaps/MUSK_FIXES_from_dossier.md, read 2026-10-08)'
    mw_g_mol: 'Pentadecanolide C15H28O2, 240.38 g/mol, as stated in the inventory musk research dossier (allgaps/MUSK_FIXES_from_dossier.md, read 2026-10-08) (PerfumersWorld lists 240.39)'
    vp_25c_pa: 'RIFM fragrance ingredient safety assessment, CAS 106-02-5, https://fragrancematerialsafetyresource.elsevier.com/sites/default/files/106-02-5.pdf; "0.027 (0.0002 torr, Vuilleumier 1995)" as quoted in the inventory musk research dossier (allgaps/MUSK_FIXES_from_dossier.md, read 2026-10-08); 0.0002 torr x 133.322 Pa/torr = 0.0267 Pa. Measurement temperature not given in the dossier; filed under 25 C as the dossier does'
    user_in_inventory: 'inventory.txt: "Macrolide (10%)  # DEPLETED 2026-07-19"'
