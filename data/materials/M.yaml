    odour_family: 'odour family "floral" from ''Floral'': Magnolan (Symrise Perfumery Ingredients datasheet), https://www.symrise.com/fileadmin/symrise/Marketing/Scent_and_care/Aroma_molecules/Ingredient_finder/SYM_PC_Datenblaetter/SYM_PC-Magnolan.pdf: Chemical Structure Floral Magnolan® (grade A_producer; ). Loaded 2026-10-25 (literature fill; source re-opened by a second reader).'
    supplier.perfumersworld: knowledge/perfumersworld_stock.md
    cas: 'PerfumersWorld SDS 3MN13569 (local snapshot, batch MAG13569/26280); RIFM fragrance ingredient safety assessment, Magnolan, CAS 27606-09-3, Food Chem. Toxicol. 130 Suppl 1 (2019) 110568, doi:10.1016/j.fct.2019.110568 (via material-data-firecrawl/BATCH1_FEMME_20261008.md)'
    mw_g_mol: 'PerfumersWorld SDS 3MN13569 (local snapshot, batch MAG13569/26280); MW 204.27, C13H16O2 (via material-data-firecrawl/BATCH1_FEMME_20261008.md)'
    logp: 'ESTIMATE: EPI Suite 2.67 as quoted by RIFM, Food Chem. Toxicol. 130 Suppl 1 (2019) 110568, doi:10.1016/j.fct.2019.110568; measured isomers 2.43 and 2.90 (RIFM 2014d) bracket it (via material-data-firecrawl/BATCH1_FEMME_20261008.md); filled 2026-10-13, Kenny chose "Fill estimates" on 2026-10-13'
    vp_25c_pa: 'ESTIMATE (EPI Suite estimate; 0.00156 x 133.322 = 0.208 Pa): RIFM fragrance ingredient safety assessment, 2,4-dimethyl-4,4a,5,9b-tetrahydroindeno[1,2-d]-1,3-dioxin (Api et al., Food Chem Toxicol 130 (2019) 110568) (https://fragrancematerialsafetyresource.elsevier.com/sites/default/files/27606-09-3.pdf): ''7. Vapor Pressure: 0.000845 mm Hg @ 20 C (EPI Suite v4.0), 0.00156 mm Hg @ 25 C (EPI Suite)''; printed 0.00156 mm Hg @ 25 C; EPI Suite estimate; 0.00156 x 133.322 = 0.208 Pa; grade EST. Second reader: RIFM assessment CAS 27606-09-3 (synonym Magnolan). EPI Suite estimate, graded EST: correct. 0.00156 x 133.322 = 0.208 Pa. Loaded 2026-10-25 (literature fill; source re-opened by a second reader).'
    density_25c_g_ml: 'SG 1.0850, supplier-reported (PerfumersWorld 3MN13569 "Magnolan"), reference temperature not stated; PW snapshot data/research/perfumersworld/20261007_01a1152f (read 2026-10-23); the single published value, not a 25 C measurement; also: 23 Oct 2026 third data pass: PerfumersWorld 3MN13569 "Specific Gravity 1.0850", https://www.perfumersworld.com/view.php?pro_id=3MN13569; temperature not printed by PerfumersWorld (Kenny''s supplier for this bottle); Ventos 1.086-1.090 at 20 C agrees'
    density_basis: supplier_sg_temperature_unstated
