    vp_25c_pa: 'ESTIMATE, not a measurement (25 Oct 2026, stock thread, from the Prada thread super-amber research): Givaudan prints the pair "0.0136 hPa / 0.0060 hPa" on both its Ambermax 50% Dowanol TPM page (https://www.givaudan.com/fragrance-beauty/fragrance-ingredients-business/fragrance-molecules/ambermaxtm-50dowanol-tpm) and its 10%/TEC page (https://www.givaudan.com/print/1314066), so the pair is not a carrier value. Read as hPa it would be 0.60-1.36 Pa, more volatile than Kephalis (Givaudan 0.0053 hPa, blotter 3 days), which contradicts Givaudan''s own Ambermax blotter tenacity of "several months" for a C18H30O of MW 262.4 and log Pow 6.3. Read as Pa, the pair is 0.006-0.014 Pa; 0.01 Pa is its midpoint. Replaces the unsourced 0.001 Pa placeholder; a measured value or Kenny''s nose ladder should replace it.'
