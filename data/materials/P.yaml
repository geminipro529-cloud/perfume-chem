    odt_air_ppb: 'UNVERIFIED analogue estimate: hexyl acetate 2.9 ppb in air (Cometto-Muniz et al., Physiol. Behav. 2008, engine row) = 17.1 ng/L, held at the same mass threshold for this C6-alcohol ester: 17.1 x 24.45 / 200.32 = 2.1 ppb. Bounds: Manzanate (same 2-methylpentanoate acid) 0.30 ng/L; branched hexyl esters can be much weaker. Order-of-magnitude only. Loaded 2026-10-28 (unused-materials group 7; source re-opened).'
    odour_family: 'odour family "citrus" from ''Citrus, Fruity'': PERANAT | Kao Chemicals store on Knowde, https://www.knowde.com/stores/kao-chemicals/products/peranat: Fragrance Family: Citrus, Fruity (grade A_producer; ). Second reader: Kao''s Peranat; data/materials/P.yaml records Pear Valerate as ''Peranat'', CAS 90397-38-9 (its link to the MySkinRecipes product is marked unverified there). Loaded 2026-10-25 (literature fill; source re-opened by a second reader).'
    character: 'Kao PERANAT data sheet (2-methylpentyl 2-methylvalerate, CAS 90397-38-9), https://chemical.kao.com/content/dam/sites/kao/chemical-kao-com/en/products/catalog_usen_B0010631.pdf: "Odor ... Fruity, pear-like, natural". Usage sentences left out. Loaded 2026-10-25 (fruit batch; source re-opened by a second reader).'
