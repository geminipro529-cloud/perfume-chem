    vp_25c_pa: 'Producer measurement band: Givaudan SA, US 10,982,173 B2 (https://patents.justia.com/patent/10982173): ''equilibrium headspace concentration from 601 ug/l to 900 ug/l, such as ... 2-methylpentyl 2-methylpentanoate (for example PERANAT)'', measured at 25 C. Band midpoint 750 ug/L x 8.314 x 298.15 / 200.32 = 9.3 Pa (band 7.4-11.1 Pa). Replaces the EPI estimate 13.9 Pa. ECHA''s ''ca. 8.7 kPa at 20 C'' fits the band only if the unit is Pa, so it is still not loaded as printed. Loaded 2026-10-28 (unused-materials group 7; source re-opened).'
