name: P0 runner probe

on:
  pull_request:
    branches:
      - codex/complexity-replacements-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm GitHub-hosted runner starts
        run: echo P0_RUNNER_OK
