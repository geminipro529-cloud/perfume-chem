[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perfume-chem-engine"
version = "0.1.0"
description = "Deterministic, evidence-labeled perfume chemistry workbench"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pre-commit>=4.4,<5",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.15.15,<1",
    "mypy>=1.7,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "data.materials"]
exclude = ["archive*", "output*", "node_modules*", "venv*", "backend*", "build*", "data.external*"]
namespaces = true

[tool.setuptools.package-data]
"data.materials" = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "data/external/**",
    ".venv/**",
    ".opencode/**",
    "output/**",
    "archive/**",
    "backend/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.basedpyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
include = ["engine", "scripts", "tests"]
exclude = ["**/__pycache__", ".venv", "output", "archive", "data/external", "backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "all"
tmp_path_retention_count = 3
