services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      # Published on this PC only. The app has no login; do not widen this
      # to all interfaces. Inside the container uvicorn still listens on 0.0.0.0.
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/backend/runtime/perfume_chem.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
      - DEBUG=True
      - REDIS_URL=redis://redis:6379/0
      - OTEL_OTLP_ENDPOINT=http://jaeger:4318
      # The engine-worker service below runs jobs; the API must not start its own.
      - PERFUME_ENGINE_WORKER_AUTOSTART=0
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/app:/app/backend/app
      - ./backend/config:/app/backend/config:ro
      - ./engine:/app/engine
      - ./data:/app/data:ro
      # Personal stock records: writable, and kept on this PC when the container goes.
      - ./data/user:/app/data/user
      - engine_job_db:/app/backend/runtime
    depends_on:
      - redis
      - jaeger

  engine-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.services.engine_job_worker"]
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/backend/runtime/perfume_chem.db
      - ENGINE_JOB_WORKER_CONCURRENCY=${ENGINE_JOB_WORKER_CONCURRENCY:-4}
      - ENGINE_JOB_WORKER_POLL_SECONDS=${ENGINE_JOB_WORKER_POLL_SECONDS:-0.5}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/app:/app/backend/app
      - ./backend/config:/app/backend/config:ro
      - ./engine:/app/engine
      - ./data:/app/data:ro
      # Personal stock records: writable, and kept on this PC when the container goes.
      - ./data/user:/app/data/user
      - engine_job_db:/app/backend/runtime
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    # No host port: only containers on this compose network (the api, via
    # REDIS_URL=redis://redis:6379/0) talk to Redis, and it has no password.
    volumes:
      - redis_data:/data

  jaeger:
    image: jaegertracing/all-in-one:1.52
    ports:
      # This PC only: traces can include request paths and formula names.
      # The api reaches Jaeger over the compose network (jaeger:4318).
      - "127.0.0.1:16686:16686"   # Jaeger UI
      - "127.0.0.1:4317:4317"     # OTLP gRPC
      - "127.0.0.1:4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  redis_data:
  engine_job_db:
